[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rad-dino"
version = "0.1.0"
authors = [
  { name="Chia-Hao Chang", email="chia.hao.chang@rwth-aachen.de" },
]
description = "Benchmarking CXR foundation models (DINO, RAD-DINO, Ark, MedSigLIP, BiomedCLIP, MedImageInsight)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "transformers>=4.51.3",
    "torchmetrics==1.7.1",
    "matplotlib==3.10.0",
    "matplotlib-inline==0.1.7",
    "numpy==2.2.5",
    "pandas==2.2.3",
    "pillow==11.2.1",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "tqdm==4.67.1",
    "pydicom==3.0.1",
    "einops==0.8.1",
    "datasets==3.3.2",
    "iterative-stratification==0.1.9",
    "pyyaml==6.0.2",
    "accelerate==1.9.0",
    "grad-cam==1.5.5",
    "huggingface_hub==0.34.3",
    "safetensors==0.5.3",
    "timm==1.0.19",
    "opencv-python==4.11.0.86",
    "scikit-image==0.25.2",
    "seaborn==0.13.2",
    "sentencepiece==0.2.0",
    "python-dotenv>=1.0",
    "SimpleITK",
    "mup>=1.0.0",
    "fvcore",
    "tenacity",
    "open-clip-torch>=2.23.0",
    "umap-learn>=0.5.6"
]

[project.optional-dependencies]
dev = [
    "pytest",
]
wandb = [
    "wandb>=0.19",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rad_dino*"]

