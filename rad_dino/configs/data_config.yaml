# Dataset root directories — update these to match your local preprocessed data locations.
# Each entry must point to the output directory produced by the corresponding
# preprocessing script in rad_dino/data/<Dataset>/.

VinDr-CXR:
  data_root_folder: "/path/to/preprocessed/VinDr-CXR"
  num_workers: 4

RSNA-Pneumonia:
  data_root_folder: "/path/to/preprocessed/RSNA-Pneumonia"
  num_workers: 16

VinDr-Mammo:
  data_root_folder: "/path/to/preprocessed/VinDr-Mammo/birads"
  num_workers: 4
  multi_view:
    num_views: 4
    view_fusion_type: "mean"
    adapter_dim: null
    view_fusion_hidden_dim: null

TAIX-Ray:
  data_root_folder: "/path/to/preprocessed/TAIX-Ray"
  num_workers: 8

NODE21:
  data_root_folder: "/path/to/preprocessed/NODE21"
  num_workers: 8

COVID-CXR:
  data_root_folder: "/path/to/preprocessed/COVID-CXR"
  num_workers: 4

VinDr-PCXR:
  data_root_folder: "/path/to/preprocessed/VinDr-PCXR"
  num_workers: 4

VinDr-SpineXR:
  data_root_folder: "/path/to/preprocessed/VinDr-SpineXR"
  num_workers: 4

TBX11K:
  data_root_folder: "/path/to/preprocessed/TBX11K/multiclass"
  num_workers: 4
